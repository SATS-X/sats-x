<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/sats-x.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <title>SATS X — Intelligent Attendance</title>
        <meta name="description" content="SATS X is an intelligent biometric attendance platform for connected classrooms." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <!-- Apply the saved theme before React mounts to avoid a flash. -->
        <script>
            (function () {
                try {
                    var stored = localStorage.getItem('theme');
                    var theme =
                        stored === 'light' || stored === 'dark'
                            ? stored
                            : window.matchMedia('(prefers-color-scheme: dark)').matches
                              ? 'dark'
                              : 'light';
                    document.documentElement.dataset.theme = theme;
                } catch (e) {
                    document.documentElement.dataset.theme = 'light';
                }
            })();
        </script>
    </head>
    <body>
        <!--
            THESIS: one continuous workspace, from a camera at the classroom door to a verified record.
            OWN-WORLD: cool neutral panels, inverted ink actions, Geist with mono measurements, teal signal.
            STORY: instructors see what the system recorded, correct the roster, and trust the result.
            FIRST VIEWPORT: glass header, headline left, live pipeline panel right, primary action under the copy.
            FORM: user-pinned ArchFlow visual language, carrying SATS X identity.
        -->
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
