build_flags =
	-Iinclude
	-Ilib/secrets
lib_deps =
	bodmer/TJpg_Decoder@^1.1.0
	bodmer/TFT_eSPI @ ^2.5.33
	gilmaimon/ArduinoWebsockets@^0.5.4
